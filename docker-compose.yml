version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: food-tracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: food_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d food_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    container_name: food-tracking-redis-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: food-tracking-redis-cache
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: food-tracking-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_queue_data:
  redis_cache_data:
  minio_data:

# Kullanım:
#   docker compose up -d
#   docker compose down          (container'ları durdurur, veri kalır)
#   docker compose down -v       (container'ları VE verileri siler, temiz başlangıç)
#
# .env dosyanızda bu servislere karşılık gelen değerler:
#   DATABASE_URL=postgresql://app:app@localhost:5432/food_tracking
#   REDIS_URL=redis://localhost:6379
#   REDIS_CACHE_URL=redis://localhost:6380
#   R2_ENDPOINT=http://localhost:9000
#   R2_ACCESS_KEY=minioadmin
#   R2_SECRET_KEY=minioadmin
#   (R2_BUCKET adını MinIO konsolundan (localhost:9001) elle oluşturmanız gerekir,
#    gerçek R2'de bunu Cloudflare dashboard'undan yapıyorsunuz)
#
# NOT: Bu dosya, testcontainers'ın kullandığı GEÇİCİ container'lardan farklı bir
# amaca hizmet eder — bu servisler sürekli açık kalır, geliştirme sırasında
# uygulamayı manuel çalıştırıp denemek için kullanılır. Testler (npm run
# test:integration) kendi izole container'larını testcontainers ile ayrıca açar,
# bu docker-compose servislerini KULLANMAZ.
