version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: food-tracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: food_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d food_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    container_name: food-tracking-redis-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: food-tracking-redis-cache
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: food-tracking-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_queue_data:
  redis_cache_data:
  minio_data:

# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose down -v
#
# Matching local .env values:
#   DATABASE_URL=postgresql://app:app@localhost:5432/food_tracking
#   REDIS_URL=redis://localhost:6379
#   REDIS_CACHE_URL=redis://localhost:6380
#
# Notes:
# - This backend currently builds the object storage endpoint from R2_ACCOUNT_ID,
#   so it expects real Cloudflare R2 credentials in .env.
# - MinIO is kept here as a local S3-compatible service for future local storage
#   work and for manual experimentation, but the current app code does not use it
#   without additional changes.
# - The Python RAG service behind RAG_SERVICE_URL is not included in this repo
#   and must be run separately if you want photo recognition to work locally.
# - Integration tests still use isolated Testcontainers services, not this compose file.
