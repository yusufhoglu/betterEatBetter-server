# Production stack for a shared VPS whose Caddy (a separate compose project)
# owns ports 80/443 and terminates TLS.
#
# This stack publishes the app on 127.0.0.1:3100 only; the host Caddy
# (matcher-prod-caddy, which has host.docker.internal -> host-gateway) proxies to
# it the same way it already proxies the *.dev.yusufhocaoglu.site services:
#
#   foodtracker.hembul.com {
#       encode gzip
#       reverse_proxy host.docker.internal:3100
#   }
#
# Setup:
#   cp .env.production.example .env      # then fill it in
#   export IMAGE=ghcr.io/yusufhoglu/bettereatbetter-server:latest
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# The CI workflow (.github/workflows/deploy.yml) runs the pull/migrate/up steps over SSH.

name: food-tracker

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/food_tracking
    REDIS_URL: redis://redis-queue:6379
    REDIS_CACHE_URL: redis://redis-cache:6379

services:
  app:
    <<: *app-env
    image: ${IMAGE:?set IMAGE to the pushed container image}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # Bound to the docker0 gateway IP: reachable by the Caddy container
    # (host.docker.internal -> 172.17.0.1) but not from the public interface.
    ports:
      - "172.17.0.1:3100:3000"
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: `docker compose -f docker-compose.prod.yml run --rm migrate`
  migrate:
    <<: *app-env
    image: ${IMAGE:?set IMAGE to the pushed container image}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: food_tracking
    # Bound to the server's loopback only -- not reachable from the public
    # interface. Lets an operator reach the DB from their laptop via an SSH
    # tunnel: `ssh -N -L 5433:localhost:5432 <server>` then connect to
    # 127.0.0.1:5433 (e.g. `npx prisma studio`).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d food_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_queue_data:
